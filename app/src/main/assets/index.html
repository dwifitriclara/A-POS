<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A-POS • SEGI COFFEE</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --surface-alt: #F3ECE2;
      --border: #DFD3C3;
      --primary: #3E2723;
      --primary-hover: #2C1B18;
      --accent: #795548;
      --accent-soft: #EFEBE9;
      --text: #231715;
      --muted: #6D5D58;
      --success: #2E7D32;
      --success-bg: #E8F5E9;
      --warning: #EF6C00;
      --warning-bg: #FFF3E0;
      --danger: #C62828;
      --danger-bg: #FFEBEE;
      --shadow: 0 2px 10px rgba(62, 39, 35, 0.07);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .topbar {
      background: var(--primary);
      color: #FFF;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 9px;
      background: #D7CCC8; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; letter-spacing: 0.5px;
    }
    .brand-title { font-weight: 800; font-size: 16px; letter-spacing: 0.4px; }
    .brand-sub { font-size: 11px; color: #D7CCC8; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .sync-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.14); color: #FFF;
    }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #81C784; }
    .sync-dot.offline { background: #FFB74D; }

    .nav-tabs {
      display: flex; gap: 6px; overflow-x: auto; padding: 2px 0;
    }
    .nav-btn {
      background: rgba(255,255,255,0.1);
      color: #EFEBE9;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn.active {
      background: #FAF7F2;
      color: var(--primary);
      border-color: #FAF7F2;
    }
    .badge-count {
      background: var(--warning);
      color: #FFF;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 700;
    }

    .user-controls { display: flex; align-items: center; gap: 8px; }
    .role-badge {
      background: #5D4037;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-switch {
      background: #D7CCC8;
      color: var(--primary);
      border: none;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* MAIN LAYOUT */
    .main-container {
      flex: 1;
      padding: 14px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* CARDS & BUTTONS */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .btn {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #FFF; }
    .btn-accent { background: var(--accent); color: #FFF; }
    .btn-success { background: var(--success); color: #FFF; }
    .btn-danger { background: var(--danger); color: #FFF; }
    .btn-outline { background: var(--surface); color: var(--primary); border: 1.5px solid var(--border); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 7px; }
    .btn-block { width: 100%; }

    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: #FFF;
      color: var(--text);
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .form-group { margin-bottom: 11px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    /* KASIR SPLIT LAYOUT */
    .pos-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 820px) {
      .pos-layout { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }

    .cat-pills { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .cat-pill {
      padding: 7px 13px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .cat-pill.active { background: var(--primary); color: #FFF; border-color: var(--primary); }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
    }
    .menu-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 96px;
      transition: transform 0.08s, border-color 0.15s;
    }
    .menu-card:active { transform: scale(0.98); border-color: var(--primary); }
    .menu-cat { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
    .menu-name { font-size: 14px; font-weight: 800; margin: 4px 0; line-height: 1.25; }
    .menu-price { font-size: 13px; font-weight: 700; color: var(--primary); }

    .cart-box { position: sticky; top: 70px; }
    .order-type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .type-btn {
      padding: 8px; border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--surface-alt); font-weight: 800; font-size: 12px; cursor: pointer;
    }
    .type-btn.active { background: var(--primary); color: #FFF; border-color: var(--primary); }

    .cart-items { max-height: 310px; overflow-y: auto; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin: 10px 0; }
    .cart-item {
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .cart-item:last-child { border-bottom: none; }
    .qty-ctrl { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface-alt); font-weight: 800; cursor: pointer;
    }
    .note-tag {
      display: inline-block; font-size: 11px; background: var(--warning-bg);
      color: var(--warning); padding: 2px 6px; border-radius: 5px; margin-top: 3px; font-weight: 600;
    }

    .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .summary-total { font-size: 17px; font-weight: 900; color: var(--primary); border-top: 1.5px solid var(--border); padding-top: 8px; margin-top: 6px; }

    /* DAPUR & HISTORY */
    .kitchen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .ticket-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px;
      border-top: 5px solid var(--warning);
    }
    .ticket-card.done { border-top-color: var(--success); opacity: 0.85; }
    .ticket-card.voided { border-top-color: var(--danger); background: #FFF8F8; }

    /* PRINTER & THERMAL PREVIEW */
    .printer-layout { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; align-items: start; }
    @media (max-width: 860px) { .printer-layout { grid-template-columns: 1fr; } }

    .bt-device {
      padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .bt-device.selected { border-color: var(--success); background: var(--success-bg); }

    .thermal-paper-wrap {
      background: #E6DFD5; padding: 18px; border-radius: 12px; display: flex; justify-content: center;
    }
    .thermal-paper {
      background: #FFFDF9;
      color: #1A1A1A;
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      line-height: 1.32;
      padding: 16px 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      width: 270px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .preview-logo-box { text-align: center; margin-bottom: 6px; }
    .preview-logo-box canvas { max-width: 100%; height: auto; image-rendering: pixelated; }

    /* SUBTABS IN KELOLA */
    .subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .subtab-btn {
      padding: 8px 13px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .subtab-btn.active { background: var(--primary); color: #FFF; border-color: var(--primary); }

    /* MODALS */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(20, 12, 10, 0.65);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: 14px; max-width: 440px; width: 100%;
      padding: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.28); max-height: 92vh; overflow-y: auto;
    }
    .modal-title { font-size: 17px; font-weight: 900; color: var(--primary); margin-bottom: 10px; }

    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 800;
    }
    .badge-success { background: var(--success-bg); color: var(--success); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); }
    .badge-neutral { background: var(--surface-alt); color: var(--primary); }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { font-weight: 800; color: var(--muted); background: var(--surface-alt); }

    .toast {
      position: fixed; bottom: 18px; right: 18px; background: var(--primary); color: #FFF;
      padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22); z-index: 200; display: none;
    }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand-logo">SC</div>
      <div>
        <div class="brand-title" id="topStoreName">SEGI COFFEE</div>
        <div class="brand-sub">
          <span id="topBranchName">Cabang Utama</span>
          <span class="sync-pill" id="syncStatusPill">
            <span class="sync-dot" id="syncDot"></span>
            <span id="syncText">Lokal Siap</span>
          </span>
        </div>
      </div>
    </div>

    <nav class="nav-tabs" id="mainNavTabs">
      <button class="nav-btn active" data-tab="kasir" onclick="switchTab('kasir')">Kasir</button>
      <button class="nav-btn" data-tab="dapur" onclick="switchTab('dapur')">
        Dapur <span class="badge-count" id="kitchenBadge">0</span>
      </button>
      <button class="nav-btn" data-tab="laci" onclick="switchTab('laci')">Laci Kas</button>
      <button class="nav-btn" data-tab="printer" onclick="switchTab('printer')">Printer</button>
      <button class="nav-btn" data-tab="kelola" onclick="switchTab('kelola')">Kelola</button>
    </nav>

    <div class="user-controls">
      <span class="role-badge" id="activeUserBadge">Owner</span>
      <button class="btn-switch" onclick="openAccountModal()">Ganti Akun</button>
    </div>
  </header>

  <main class="main-container">

    <!-- ==================== TAB 1: KASIR ==================== -->
    <section id="tab-kasir" class="tab-pane active">
      <div class="pos-layout">
        <div>
          <div class="card" style="padding: 12px;">
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <input type="text" id="menuSearch" placeholder="Cari menu kopi / makanan..." oninput="renderMenuGrid()" />
            </div>
            <div class="cat-pills" id="categoryPills"></div>
            <div class="menu-grid" id="menuGrid"></div>
          </div>
        </div>

        <div class="card cart-box">
          <div class="card-title">
            <span>Pesanan Baru</span>
            <span class="badge badge-neutral" id="nextOrderBadge">Next #0001</span>
          </div>

          <div class="order-type-toggle">
            <button class="type-btn active" id="btnDineIn" onclick="setOrderType('DINE IN')">DINE IN</button>
            <button class="type-btn" id="btnTakeAway" onclick="setOrderType('TAKE AWAY')">TAKE AWAY</button>
          </div>

          <div class="form-group" style="margin-bottom:8px;">
            <input type="text" id="customerNameInput" placeholder="Nama Pelanggan / No. Meja (Opsional)" />
          </div>

          <div class="cart-items" id="cartItemsList">
            <div style="text-align:center; color:var(--muted); padding:24px 0; font-size:13px;">
              Belum ada item dipilih
            </div>
          </div>

          <div id="discountRow" class="form-group" style="display:flex; gap:8px; align-items:center;">
            <label style="margin:0; white-space:nowrap;">Diskon (Rp):</label>
            <input type="number" id="discountInput" value="0" min="0" oninput="renderCart()" />
          </div>

          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="cartSubtotal">Rp 0</strong>
          </div>
          <div class="summary-row">
            <span>Diskon</span>
            <span id="cartDiscount">- Rp 0</span>
          </div>
          <div class="summary-row summary-total">
            <span>Grand Total</span>
            <span id="cartGrandTotal">Rp 0</span>
          </div>

          <div class="grid-2" style="margin-top:12px;">
            <button class="btn btn-primary" onclick="openCheckoutModal('CASH')">Bayar Tunai</button>
            <button class="btn btn-success" onclick="openCheckoutModal('QRIS')">Bayar QRIS</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ==================== TAB 2: DAPUR ==================== -->
    <section id="tab-dapur" class="tab-pane">
      <div class="card">
        <div class="card-title">
          <span>Antrean Pesanan Barista / Dapur</span>
          <span style="font-size:12px; color:var(--muted);">Struk dapur tercetak otomatis saat pembayaran</span>
        </div>
        <div class="kitchen-grid" id="kitchenList"></div>
      </div>
    </section>

    <!-- ==================== TAB 3: LACI KAS & AUDIT ==================== -->
    <section id="tab-laci" class="tab-pane">
      <div class="grid-3">
        <div class="card">
          <label>Modal Awal Laci Kas (Rp)</label>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="number" id="openingCashInput" value="200000" />
            <button class="btn btn-primary btn-sm" onclick="saveOpeningCash()">Simpan</button>
          </div>
        </div>
        <div class="card">
          <label>Omzet Bersih Hari Ini (Non-Void)</label>
          <div style="font-size:20px; font-weight:900; color:var(--success); margin-top:4px;" id="statNetSales">Rp 0</div>
          <div style="font-size:11px; color:var(--muted);" id="statPaymentSplit">Tunai: Rp 0 • QRIS: Rp 0</div>
        </div>
        <div class="card">
          <label>Estimasi Uang di Laci</label>
          <div style="font-size:20px; font-weight:900; color:var(--primary); margin-top:4px;" id="statExpectedDrawer">Rp 0</div>
          <button class="btn btn-outline btn-sm" style="margin-top:6px;" onclick="printShiftSummary()">Cetak Rekap Kas</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Riwayat Transaksi</span>
          <span style="font-size:11px; color:var(--danger); font-weight:700;">*Hapus/Void terkunci khusus
